[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secpatch-dag"
version = "0.1.0"
description = "Headless vulnerability dependency analysis and patch scheduling engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pytest>=8.0",
  "httpx>=0.27",
  "ortools>=9.15",
  "packaging>=24",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "backend*", "infrastructure*"]
